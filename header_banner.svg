<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0a0a0c; }
      .border-line { stroke: #ffffff; stroke-width: 2; fill: none; }
      .title { font-family: 'Courier New', Courier, monospace, sans-serif; font-weight: 900; fill: #ffffff; font-size: 36px; letter-spacing: 4px; }
      .subtitle { font-family: 'Courier New', Courier, monospace, sans-serif; font-weight: 700; fill: #cccccc; font-size: 15px; letter-spacing: 3px; }
      .kanji { font-family: 'Hiragino Mincho ProN', 'MS Mincho', serif; font-weight: bold; fill: #ffffff; opacity: 0.12; font-size: 110px; }
      .tag { font-family: monospace; fill: #ffffff; font-size: 12px; letter-spacing: 2px; }
      .butterfly { fill: none; stroke: #ffffff; stroke-width: 1.5; }
    </style>
    <pattern id="halftone" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" class="bg" />
  <rect width="900" height="240" fill="url(#halftone)" />

  <!-- Outer Frame (Manga Panel Border) -->
  <rect x="10" y="10" width="880" height="220" class="border-line" stroke-width="3" />
  <rect x="16" y="16" width="868" height="208" class="border-line" stroke-width="1" stroke-dasharray="6,4" />

  <!-- Background Kanji: 欲の魔女 (Witch of Greed) -->
  <text x="860" y="160" text-anchor="end" class="kanji">強欲の魔女</text>

  <!-- Butterfly Motif Line Art -->
  <g transform="translate(50, 65)">
    <path class="butterfly" d="M 30 40 Q 10 10 40 10 Q 50 30 30 40 Q 10 60 40 70 Q 50 50 30 40 Z" />
    <path class="butterfly" d="M 30 40 Q 50 10 20 10 Q 10 30 30 40 Q 50 60 20 70 Q 10 50 30 40 Z" />
    <circle cx="30" cy="40" r="2" fill="#ffffff" />
  </g>

  <!-- Main Titles -->
  <text x="120" y="95" class="title">CHARLES AERON PELAYO</text>
  <text x="122" y="132" class="subtitle">WITCH OF GREED'S ARCHIVE // FULL-STACK DEVELOPER</text>
  <text x="122" y="162" class="tag">[ RE:ZERO MANGA SYSTEM // UI/UX DESIGNER ]</text>

  <!-- Corner Accents -->
  <line x1="10" y1="10" x2="40" y2="10" stroke="#ffffff" stroke-width="6" />
  <line x1="10" y1="10" x2="10" y2="40" stroke="#ffffff" stroke-width="6" />
  <line x1="890" y1="230" x2="860" y2="230" stroke="#ffffff" stroke-width="6" />
  <line x1="890" y1="230" x2="890" y2="200" stroke="#ffffff" stroke-width="6" />
</svg>
