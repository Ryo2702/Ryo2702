<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #000000; }
      .manga-border { stroke: #ffffff; stroke-width: 4; fill: none; }
      .hair { fill: #e6e6e6; stroke: #000000; stroke-width: 2; }
      .dress { fill: #111115; stroke: #ffffff; stroke-width: 2; }
      .skin { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .eye-bg { fill: #111115; }
      .iris { fill: #ffffff; }
      .pupil { fill: #111115; }
      .butterfly { fill: #111115; stroke: #ffffff; stroke-width: 1.5; }
      .screentone { fill: url(#dots); opacity: 0.25; }
      .manga-text { font-family: 'Hiragino Mincho ProN', 'MS Mincho', serif; font-weight: 900; fill: #ffffff; font-size: 26px; }
      .subtext { font-family: monospace; fill: #cccccc; font-size: 13px; letter-spacing: 2px; }
      .speedline { stroke: #ffffff; stroke-width: 1; opacity: 0.15; }
    </style>

    <pattern id="dots" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" />
    </pattern>

    <pattern id="hatch" x="0" y="0" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" class="bg" />
  <rect width="500" height="500" fill="url(#dots)" class="screentone" />

  <!-- Speed lines background effect -->
  <g>
    <line x1="250" y1="250" x2="0" y2="0" class="speedline" />
    <line x1="250" y1="250" x2="500" y2="0" class="speedline" />
    <line x1="250" y1="250" x2="0" y2="500" class="speedline" />
    <line x1="250" y1="250" x2="500" y2="500" class="speedline" />
    <line x1="250" y1="250" x2="250" y2="0" class="speedline" />
    <line x1="250" y1="250" x2="250" y2="500" class="speedline" />
    <line x1="250" y1="250" x2="0" y2="250" class="speedline" />
    <line x1="250" y1="250" x2="500" y2="250" class="speedline" />
  </g>

  <!-- Outer Frame -->
  <rect x="12" y="12" width="476" height="476" class="manga-border" stroke-width="5" />
  <rect x="20" y="20" width="460" height="460" class="manga-border" stroke-width="1.5" stroke-dasharray="8,4" />

  <!-- Character Vector Art: Echidna -->
  <g transform="translate(40, 20)">

    <!-- Back Hair -->
    <path class="hair" d="M 80 180 Q 50 280 40 400 L 380 400 Q 370 280 340 180 Z" />

    <!-- Dress / Body -->
    <path class="dress" d="M 120 340 Q 210 320 300 340 L 350 440 L 70 440 Z" />
    <!-- Dress Collar Details -->
    <path fill="none" stroke="#ffffff" stroke-width="2" d="M 180 340 Q 210 370 240 340" />
    <path fill="none" stroke="#ffffff" stroke-width="1.5" d="M 190 355 Q 210 375 230 355" />

    <!-- Neck -->
    <rect x="195" y="290" width="30" height="55" class="skin" />
    <!-- Neck Shadow -->
    <path fill="url(#hatch)" d="M 195 315 L 225 315 L 225 345 L 195 345 Z" />

    <!-- Face Oval -->
    <path class="skin" d="M 140 190 Q 210 310 280 190 Q 280 120 210 110 Q 140 120 140 190 Z" />

    <!-- Eyes (Echidna Dark Manga Eyes) -->
    <!-- Left Eye -->
    <g>
      <ellipse cx="178" cy="195" rx="18" ry="14" class="eye-bg" />
      <ellipse cx="178" cy="195" rx="10" ry="10" class="iris" />
      <ellipse cx="178" cy="195" rx="5" ry="5" class="pupil" />
      <path d="M 156 186 Q 178 178 200 186" fill="none" stroke="#000000" stroke-width="3" />
      <path d="M 158 205 Q 178 212 198 205" fill="none" stroke="#000000" stroke-width="1.5" />
    </g>

    <!-- Right Eye -->
    <g>
      <ellipse cx="242" cy="195" rx="18" ry="14" class="eye-bg" />
      <ellipse cx="242" cy="195" rx="10" ry="10" class="iris" />
      <ellipse cx="242" cy="195" rx="5" ry="5" class="pupil" />
      <path d="M 220 186 Q 242 178 264 186" fill="none" stroke="#000000" stroke-width="3" />
      <path d="M 222 205 Q 242 212 262 205" fill="none" stroke="#000000" stroke-width="1.5" />
    </g>

    <!-- Eyebrows -->
    <path d="M 155 174 Q 178 166 202 174" fill="none" stroke="#000000" stroke-width="2" />
    <path d="M 218 174 Q 242 166 265 174" fill="none" stroke="#000000" stroke-width="2" />

    <!-- Nose -->
    <path d="M 210 215 L 207 225 L 213 225" fill="none" stroke="#000000" stroke-width="2" />

    <!-- Subtle Smile -->
    <path d="M 195 248 Q 210 256 225 248" fill="none" stroke="#000000" stroke-width="2.5" />

    <!-- Front Bangs (Echidna Silver Bangs) -->
    <path class="hair" d="M 130 140 Q 170 210 180 180 Q 210 120 210 105 Q 210 120 240 180 Q 250 210 290 140 Q 250 80 210 80 Q 170 80 130 140 Z" />
    <path class="hair" d="M 160 110 Q 195 190 200 215 Q 205 160 210 105 Z" />

    <!-- Black Butterfly Hairpiece -->
    <g transform="translate(265, 115) rotate(15)">
      <path class="butterfly" d="M 20 20 Q 5 0 25 0 Q 30 15 20 20 Q 5 35 25 40 Q 30 30 20 20 Z" />
      <path class="butterfly" d="M 20 20 Q 35 0 15 0 Q 10 15 20 20 Q 35 35 15 40 Q 10 30 20 20 Z" />
      <circle cx="20" cy="20" r="2.5" fill="#ffffff" />
    </g>

  </g>

  <!-- Manga Caption Overlay Box -->
  <rect x="30" y="405" width="440" height="60" fill="#000000" stroke="#ffffff" stroke-width="2" />
  <text x="45" y="442" class="manga-text">「強欲の魔女・エキドナ」</text>
  <text x="455" y="442" text-anchor="end" class="subtext">ECHIDNA // WITCH OF GREED</text>
</svg>
