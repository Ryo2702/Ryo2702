<text x="20" y="88" font-size="17">UNDERSTAND</text>
<path d="M192 32V96" stroke="#888888"/>
<text class="headline" x="212" y="57" font-size="25">02</text>
<rect class="bit" x="347" y="40" width="14" height="14" fill="#FFFFFF" style="animation-delay:-0.8s"/>
<text x="212" y="88" font-size="17">PLAN</text>
<path d="M384 32V96" stroke="#888888"/>
<text class="headline" x="404" y="57" font-size="25">03</text>
<rect class="bit" x="539" y="40" width="14" height="14" fill="#FFFFFF" style="animation-delay:-1.6s"/>
<text x="404" y="88" font-size="17">BUILD</text>
<path d="M576 32V96" stroke="#888888"/>
<text class="headline" x="596" y="57" font-size="25">04</text>
