<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title">
<title id="title">Charles Aeron L. Pelayo — freelance web developer, with Subaru pixel artwork</title>
<style>
  svg { --ink: #000000; --paper: #FFFFFF; }
  @media (prefers-color-scheme: dark) { svg { --ink: #FFFFFF; --paper: #000000; } }
  text { font-family: 'JetBrains Mono', Consolas, 'Liberation Mono', monospace; fill: var(--ink); }
  .headline { font-weight: 800; letter-spacing: 2px; }
  [fill="#FFFFFF"] { fill: var(--ink); }
  [stroke="#FFFFFF"] { stroke: var(--ink); }
  .bit { animation: bit 4s steps(1, end) infinite; }
  .solve { stroke-dasharray: 1; animation: solve 18s linear infinite; }
  .still { display: none; }
  @keyframes bit { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes solve { 0%, 8% { stroke-dashoffset: 1; } 88%, 100% { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .bit, .solve { animation: none; }
    .fx { display: none; }
    .still { display: inline; }
  }
</style>
